<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PolicyWell">
  <!-- Transparent favicon mark: shield + well + verified policy -->
  <defs>
    <linearGradient id="shield" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D6B5A"/>
      <stop offset="1" stop-color="#0F2F28"/>
    </linearGradient>
    <linearGradient id="brick" x1="18" y1="36" x2="46" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F6F55"/>
      <stop offset="1" stop-color="#0F2F28"/>
    </linearGradient>
  </defs>

  <!-- Shield outline -->
  <path
    fill="none"
    stroke="url(#shield)"
    stroke-width="4.5"
    stroke-linejoin="round"
    d="M32 6
       C42 6 50 8 54 10
       V30
       C54 44 44 54 32 58
       C20 54 10 44 10 30
       V10
       C14 8 22 6 32 6Z"
  />

  <!-- Well / brick ring -->
  <ellipse cx="32" cy="46" rx="14" ry="7.5" fill="url(#brick)"/>
  <ellipse cx="32" cy="43.5" rx="14" ry="7.5" fill="#3D6B5A"/>
  <ellipse cx="32" cy="42" rx="11" ry="5.5" fill="#0A1F1A"/>
  <path
    fill="none"
    stroke="#8FAFA0"
    stroke-width="1"
    opacity="0.55"
    d="M20 44.5 C24 47 28 48.2 32 48.2 C36 48.2 40 47 44 44.5"
  />

  <!-- Document -->
  <path
    fill="#F5FAF7"
    stroke="#0F2F28"
    stroke-width="1.4"
    stroke-linejoin="round"
    d="M24 16 h12 l8 8 v20 a3 3 0 0 1 -3 3 H24 a3 3 0 0 1 -3 -3 V19 a3 3 0 0 1 3 -3Z"
  />
  <path fill="#D5E4DC" d="M36 16 v7 a1 1 0 0 0 1 1 h7Z"/>

  <!-- Text lines -->
  <rect x="26.5" y="26" width="11" height="2" rx="1" fill="#3D6B5A"/>
  <rect x="26.5" y="30.5" width="8" height="2" rx="1" fill="#8FAFA0"/>

  <!-- Checkmark -->
  <path
    fill="none"
    stroke="#2F6F55"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M27.5 38.5 l4 4 8 -9"
  />
</svg>
